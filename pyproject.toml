[project]
name = "sevro"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.12.1",
    "xxjson>=0.2.0",
]

[build-system]
requires= ["maturin>=1.12.6"]
build-backend = "maturin"

[tool.maturin]
module-name="sevro.core"
bindings="pyo3"

[dependency-groups]
dev = [
    "granian>=2.7.2",
    "pytest>=9.0.2",
    "uvicorn>=0.41.0",
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "winloop>=0.5.0; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
